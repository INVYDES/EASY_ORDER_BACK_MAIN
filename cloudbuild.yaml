steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - $_AR_LOCATION-docker.pkg.dev/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:$BUILD_ID
      - -t
      - $_AR_LOCATION-docker.pkg.dev/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - $_AR_LOCATION-docker.pkg.dev/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE_NAME
      - --image=$_AR_LOCATION-docker.pkg.dev/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:$BUILD_ID
      - --region=$_DEPLOY_REGION
      - --platform=managed
      - --allow-unauthenticated
      - --cpu=2
      - --memory=1Gi
      - --min-instances=1
      - --max-instances=10
      - --concurrency=80
      - --timeout=300
      - --update-env-vars=^#^APP_ENV=production#APP_DEBUG=false#APP_NAME=EasyOrder#APP_URL=https://eorder.mx#CACHE_STORE=database#QUEUE_CONNECTION=database#SESSION_DRIVER=database#LOG_CHANNEL=stderr#DB_CONNECTION=mysql#DB_HOST=turntable.proxy.rlwy.net#DB_PORT=12823#DB_DATABASE=railway#DB_USERNAME=root#FRONTEND_URL=https://eorder.mx#SANCTUM_STATEFUL_DOMAINS=eorder.mx,www.eorder.mx#CORS_ALLOWED_ORIGINS=https://eorder.mx,https://www.eorder.mx#SESSION_DOMAIN=.easy-order-back-201452705980.us-central1.run.app#SESSION_SECURE_COOKIE=true#TRUSTED_PROXIES=*#BROADCAST_CONNECTION=reverb#REVERB_APP_ID=411884#REVERB_APP_KEY=ds9d0dge2etayrnrzaca#REVERB_HOST=localhost#REVERB_PORT=443#REVERB_SCHEME=https#MERCADOPAGO_MODE=production#MERCADOPAGO_PUBLIC_KEY=APP_USR-d68f369a-15e1-4876-950f-a75814e5c221#FILESYSTEM_IMAGES_DISK=s3#AWS_DEFAULT_REGION=auto#AWS_BUCKET=eorder-ing#AWS_ENDPOINT=https://d710289688d71dc4b5c6c57e2ed3d91e.r2.cloudflarestorage.com#AWS_URL=https://pub-d695805af99b445996579ecbc0fb909c.r2.dev#AWS_USE_PATH_STYLE_ENDPOINT=true#MAIL_MAILER=gmail-api#MAIL_FROM_ADDRESS=eorder.mexico@gmail.com#MAIL_FROM_NAME=Easy Order#MAIL_CONTACT_RECIPIENT=eorder.mexico@gmail.com#WHATSAPP_PROVIDER=evolution#EVOLUTION_INSTANCE_NAME=eorder#WHATSAPP_RECIPIENT_NUMBER=522294848144#GEMINI_MODEL=gemini-3.6-flash
      - --update-secrets=APP_KEY=eorder-app-key:latest,DB_PASSWORD=eorder-db-password:latest,AWS_ACCESS_KEY_ID=eorder-r2-access-key:latest,AWS_SECRET_ACCESS_KEY=eorder-r2-secret-key:latest,GOOGLE_CLIENT_ID=eorder-google-client-id:latest,GOOGLE_CLIENT_SECRET=eorder-google-client-secret:latest,GOOGLE_REFRESH_TOKEN=eorder-gmail-refresh-token:latest,EVOLUTION_API_KEY=eorder-evolution-api-key:latest,GEMINI_API_KEY=eorder-gemini-api-key:latest,REVERB_APP_SECRET=eorder-reverb-app-secret:latest,MERCADOPAGO_ACCESS_TOKEN=eorder-mercadopago-access-token:latest,MERCADOPAGO_WEBHOOK_SECRET=eorder-mercadopago-webhook-secret:latest


  # El Job programado debe correr exactamente la misma imagen que el servicio.
  # Se fija al tag inmutable $BUILD_ID (no a :latest) para que no se desincronice.
  - id: update-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - update
      - $_JOB_NAME
      - --image=$_AR_LOCATION-docker.pkg.dev/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:$BUILD_ID
      - --region=$_DEPLOY_REGION


substitutions:
  _SERVICE_NAME: easy-order-back
  _JOB_NAME: easy-order-scheduler
  _DEPLOY_REGION: us-central1
  _AR_LOCATION: us-central1
  _AR_REPOSITORY: cloud-run-source-deploy

images:
  - $_AR_LOCATION-docker.pkg.dev/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:$BUILD_ID
  - $_AR_LOCATION-docker.pkg.dev/$PROJECT_ID/$_AR_REPOSITORY/$_SERVICE_NAME:latest